[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "church-admin-media-web"
version = "0.1.0"
description = "Admin dashboard backend bridging the browser to the church media server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-socketio[asyncio_client]>=5.11",
    "pydantic-settings>=2.1",
    "itsdangerous>=2.1",
    "cryptography>=42",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120
